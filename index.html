<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Dino Game - Hack Edition</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #f7f7f7;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; color: #535353;
            user-select: none; overflow: hidden;
            transition: background-color 0.5s, color 0.5s;
        }
        body.dark-mode { background-color: #202124; color: #e8eaed; }
        .game-wrapper { position: relative; width: 600px; }
        .canvas-container { position: relative; width: 600px; height: 150px; }
        canvas { display: block; background: transparent; }
        .cheat-panel {
            margin-top: 30px; padding: 15px 20px; width: 100%;
            background: #ffffff; border: 1px dashed #535353; border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center; gap: 15px; font-size: 13px;
            transition: background 0.5s, border-color 0.5s;
        }
        body.dark-mode .cheat-panel { background: #2a2b2e; border-color: #e8eaed; }
        .cheat-group { display: flex; align-items: center; gap: 20px; }
        .cheat-item { display: flex; align-items: center; gap: 8px; }
        .cheat-item input[type="checkbox"] { cursor: pointer; accent-color: #535353; }
        body.dark-mode .cheat-item input[type="checkbox"] { accent-color: #e8eaed; }
        .cheat-item button {
            background: #535353; color: #fff; border: none; padding: 4px 8px;
            cursor: pointer; font-family: inherit; font-size: 11px; border-radius: 2px;
        }
        body.dark-mode .cheat-item button { background: #e8eaed; color: #202124; }
        .game-info { margin-top: 12px; font-size: 11px; opacity: 0.6; text-align: center; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="canvas-container">
            <canvas id="dinoCanvas" width="600" height="150"></canvas>
        </div>

        <div class="cheat-panel">
            <div class="cheat-group">
                <div class="cheat-item">
                    <input type="checkbox" id="godModeToggle">
                    <label for="godModeToggle"><b>[H] God Mode</b></label>
                </div>
                <div class="cheat-item">
                    <input type="checkbox" id="autoJumpToggle">
                    <label for="autoJumpToggle"><b>[A] Auto-Bot</b></label>
                </div>
            </div>
            <div class="cheat-item">
                <button id="addScoreBtn">+1000 Score</button>
            </div>
        </div>

        <div class="game-info">
            Press <b>Space / ↑</b> to Jump | Press <b>↓</b> to Duck
        </div>
    </div>

    <!-- Link to external game engine file -->
    <script src="game.js"></script>
</body>
</html>
